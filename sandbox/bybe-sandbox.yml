note: >-
  BYBE runs a publicly reachable STAGING environment and links it from its own status page - the
  window.config block on https://status.bybe.com/ contains a button labelled "API Docs" pointing at
  https://docs.bybestaging.io. That is BYBE naming the surface itself, which is why it is recorded
  here rather than guessed from the domain pattern.

  What BYBE does NOT publish: any test credential, magic test value, test identifier range, fixture,
  trigger tool, or time-simulation facility. There is no key-prefix convention separating test from
  live keys (both environments use HTTP Basic with an api_key/api_secret pair issued by BYBE). A
  developer cannot self-serve into this sandbox; credentials come from a BYBE representative.

environments:
