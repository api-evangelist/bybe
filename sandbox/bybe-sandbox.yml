      in the v2-alpha1 specification (https://api.bybe.io/v2/swagger.yaml declares
      https://{defaultHost} with defaultHost defaulting to api.bybestaging.io).
  - name: local
    api_host: http://api.bybe.localhost:3000
    status: n/a
    note: >-
      Declared as "Local Development Server" in the v2-alpha1 specification. Not a BYBE-hosted
      surface; recorded only because it appears verbatim in a published document.

