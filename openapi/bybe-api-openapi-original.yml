                        - must exist
                        - can't be blank
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - redemption_disbursement
              properties:
                redemption_disbursement:
                  type: object
                  required:
                  - retailer_identifier
                  - consumer
                  - purchases
                  properties:
                    payment_method:
                      type: string
                      description: The method by which the consumer wishes to receive
                        their disbursement. The recommended value is 'payout_flow'
                        (this is also the default when not provided), which allows
                        the consumer to accrue a balance and choose their preferred
                        payment method. Supported values may vary by retailer. Please
                        contact your BYBE representative to confirm which values are
                        enabled for your retailer.
                    retailer_identifier:
                      type: string
                      description: Unique retailer ID for the redemption disbursement.
                    email:
                      type: string
                      description: The email address to send the disbursement email
                        to. If the consumer's email was already provided during consumer
                        creation using the Consumers or Clips API, then it is not
                        required to be sent again in this request.
                    consumer:
                      type: object
                      required:
                      - retailer_identifier
                      properties:
                        retailer_identifier:
                          type: string
                    purchases:
                      type: array
                      description: A list of Purchase objects from which redemptions
                        will be generated for inclusion in this redemption disbursement.
                      items:
                        type: object
                        properties:
                          retailer_identifier:
                            description: Unique retailer ID for the purchase. Typically
                              this would be your internal purchase ID or transaction
                              ID.
                            type: string
                          purchase_date:
                            type: string
                            description: The date of the purchase in ISO 8601 format,
                              preferably in the timezone of the store (e.g., "2023-10-01T08:00:00-04:00").
                              This is optional and defaults to the current time if
                              not provided.
                          store:
                            type: object
                            description: Store information where the purchase was
                              made. This must match to a store sent to BYBE previously
                              and will be used for validating redemptions.
                            properties:
                              retailer_identifier:
                                type: string
                          redemptions:
                            type: array
                            description: A list of offers to attempt to redeem against
                              this purchase. If wanting to redeem multiple times for
                              the same offer most include multiple entries for the
                              same offer ID.
                            items:
                              type: object
                              properties:
                                offer_id:
                                  type: integer
                          line_items:
                            type: array
                            items:
                              type: object
                              properties:
                                product:
                                  type: object
                                  description: Product information used for validating
                                    redemptions. One of `upc` or `retailer_identifier`
                                    is required. `upc` is the preferred identifier.
                                    If using `retailer_identifier`, you must provide
                                    your custom product codes (e.g., SKUs) to BYBE
                                    in advance.
                                  properties:
                                    upc:
                                      type: string
                                      description: Universal Product Code. Preferred
                                        identifier for products.
                                    retailer_identifier:
                                      type: string
                                      description: Custom product code (e.g., SKU).
                                        Must be pre-registered with BYBE.
                                quantity:
                                  type: integer
                                price_cents:
                                  type: integer
            examples:
              '201: Accepted: Creates a single redemption disbursement successfully':
                summary: '201: Accepted: Creates a single redemption disbursement
