      description: This endpoint allows the creation of a new redemption disbursement
        for a consumer. BYBE will run the purchase data through its rules engine to
        determine whether the offers applied to the purchase line items are valid.
        Redemptions will be created for each valid offer and line item combination,
        and BYBE will disburse money totaling the value of only the valid redemptions.
