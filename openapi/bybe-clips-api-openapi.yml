openapi: 3.2.0
info:
  title: BYBE Clips API
  version: v1
  description: "\n Welcome to the BYBE API, V1.\n\n You can use this API to access our records of manufacturers,\n rebate offers, and products,\n as well as to validate redemptions for transactions and disburse payouts.\n\n Each route is documented below via the OpenAPI specification.\n Authorization details can be entered using the `Authorize` button on the right.\n "
servers:
- url: https://api.bybe.io
  description: Base URL declared by the provider in apis.yml (roadmap#122).
tags:
- name: Clips
  description: A clip represents a consumer's intent to redeem an offer.
paths:
  /v1/clips:
    get:
      summary: list clips
      tags:
      - Clips
      description: List clips, optionally filtering by offer_id, the consumer's retailer_identifier, or other options.
      security:
      - basic_auth: []
      parameters:
      - name: page
        in: query
        required: false
        description: Page of results to return
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Number of clips per page
        schema:
          type: integer
      - name: offer_id
        in: query
        required: false
        description: Filter to a specific offer
        schema:
          type: integer
      - name: consumer_retailer_identifier
        in: query
        required: false
        description: Filter to a specific consumer
        schema:
          type: string
      responses:
        '200':
          description: list of clips
          content:
            application/json:
              examples:
                unfiltered list of clips:
                  value:
                    clips:
                    - id: 980190962
                      consumer:
