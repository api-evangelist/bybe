note: >-
  Derived from every 3xx/4xx/5xx response declared in the BYBE API v1 specification
  (https://api.bybe.io/v1/swagger.yaml). BYBE publishes no separate error-code reference page, so
  every entry below is grounded in the specification's own response description and example body.
  The API does NOT use RFC 9457 problem+json; it returns an ActiveModel-style errors map keyed by
  the resource name. There is no machine-readable error code, so an agent must match on the field
  name and message string.

