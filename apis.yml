name: BYBE
description: 'BYBE, Inc. is a promotion platform for the beer, wine, and spirits industry,
  connecting alcohol beverage brands, retailers, and consumers through digital cash-back rebates.
  Brands fund offers in the BYBE dashboard; retailers embed those offers in their own apps, sites
  and loyalty programs, and BYBE handles US state-by-state alcohol promotion compliance, redemption
  validation, clearing and consumer payout. BYBE publishes a real OpenAPI 3.0.1 contract for its
  Retail API at api.bybe.io covering manufacturers, products, offers, clips, consumers, stores and
  redemption disbursements, with HTTP Basic authentication and a documented SFTP CSV batch
  alternative for retailers that cannot call the API in real time. Backed by Techstars and Rev1
  Ventures, BYBE was acquired by Swiftly in March 2024 and continues to operate under its own brand
  and domains.'
