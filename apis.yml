apis:
- aid: bybe:bybe-api
  name: BYBE API
  description: >-
    The BYBE Retail API, version 1. A REST/JSON API over BYBE's records of manufacturers, rebate
    offers and products, plus the write surface that clips offers for consumers, validates
    redemptions against purchases, and disburses consumer payouts. 16 operations across 7 tags,
    authenticated with HTTP Basic (API key as username, API secret as password). US only - the
    state filter on offers and stores is how BYBE's state-by-state alcohol compliance boundary is
    expressed in the contract.
  humanURL: https://docs.bybe.io/
