  note: >-
    Round 2 contract discovery overturned round 1's "no developer portal, no API documentation, no
    machine-readable specification" finding. The BYBE API v1 OpenAPI 3.0.1 (16 operations) was live
    the whole time at https://api.bybe.io/v1/swagger.yaml, reachable from docs.bybe.io, which is
    linked from bybe.com's own JavaScript bundle. bybe.com is a React SPA whose catch-all answers
    HTTP 200 with index.html for every path, which is what made the first pass read as an absence.
